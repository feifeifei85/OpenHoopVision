[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenHoopVision"
version = "0.1.0"
description = "Basketball video analysis for player tracking and event detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "Pillow>=10.0",
  "rfdetr>=1.9",
  "scipy>=1.11",
  "supervision>=0.25",
  "torch>=2.5",
  "torchvision>=0.20",
  "tqdm>=4.65",
  "ultralytics>=8.3",
]

[project.scripts]
openhoopvision = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["events*", "models*", "pipeline*", "reid*", "render*", "tracking*"]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
